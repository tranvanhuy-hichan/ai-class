# ================== CẤU HÌNH HỆ THỐNG ==================
# Mọi ngưỡng đều có thể chỉnh ở đây mà không cần sửa code.

models:
  pose: weights/yolo11m-pose.pt   # Nhận diện người + 17 điểm khung xương (tự tải về lần đầu). Bản n (yolo11n-pose.pt) nhẹ hơn nhưng bỏ sót khoảng một nửa số bạn ngồi sát/nằm gục
  object: weights/yolo11m.pt      # Nhận diện vật thể COCO, dùng lớp "cell phone". Bản m bắt điện thoại tốt hơn bản n; máy yếu dùng yolo11n.pt
  # Máy KHÔNG có GPU (và bộ cài Windows, vốn dùng PyTorch CPU) tự dùng 2 mô hình nhẹ này thay cho 2 dòng trên
  pose_cpu: weights/yolo11s-pose.pt
  object_cpu: weights/yolo11n.pt
  # Cách phát hiện nhắm mắt:
  #   mediapipe  - đo độ nhắm mắt bằng 468 điểm khuôn mặt (MediaPipe), ổn định, không cần huấn luyện
  #   classifier - mô hình mắt mở/nhắm tự huấn luyện (scripts/train_eye_classifier.py)
  #   off        - tắt, chỉ dùng gục đầu lâu để báo ngủ gục
  eye_method: mediapipe
  face_landmarker: weights/face_landmarker.task   # tự tải về nếu chưa có
  eye_classifier: weights/eye_cls.pt
  custom_behavior: weights/behavior_lop.pt      # Bản cho trong lớp (phone, sleep, study; hút thuốc yếu). Bản cũ biết hút thuốc: weights/behavior.pt
  device: ""                   # "" = tự chọn (GPU nếu có), "cpu", hoặc "0"

detection:
  person_conf: 0.30            # Ngưỡng nhận người; thấp hơn để bắt cả bạn nằm gục (khung xương bị che)
  custom_conf:                 # Ngưỡng riêng từng hành vi của mô hình tự huấn luyện (không ghi thì dùng person_conf)
    phone: 0.50                # Cao hơn để bớt báo nhầm khi bạn cúi viết bài / chống cằm
    sleeping: 0.50
  smoking_conf: 0.35           # Ngưỡng riêng cho điếu thuốc (điếu thuốc nhỏ nên thấp hơn các hành vi khác). Đã đo: 0.50 bắt 41% ảnh có thuốc,
                               # 0.30 bắt 55%; trên 30 ảnh không có thuốc và 108 khung video lớp học đều 0 báo nhầm ở cả 2 mức
  phone_conf: 0.25             # Điện thoại (0.15 bắt được nhiều hơn nhưng hay nhầm vật khác như hộp bút, sổ, thước)
  keypoint_conf: 0.30          # Nhận diện khung xương nhạy hơn
  imgsz: 960                   # Tối ưu cho lớp học: 960. 1280 chỉ dùng khi có GPU mạnh (RTX 3050 bị giật)

performance:                   # Tối ưu cho máy yếu (giây; 0 = chạy mọi khung hình)
  aux_interval_cpu: 0.5        # Máy không GPU: tìm điện thoại / mô hình hành vi mỗi 0.5 giây
  aux_interval_gpu: 0.2        # Máy có GPU: tìm điện thoại / hành vi 5 lần mỗi giây (các hành vi kéo dài nhiều giây, chạy mọi khung là thừa). 0 = mọi khung
  eye_interval_cpu: 0.7        # Đo độ nhắm mắt của mỗi học sinh mỗi 0.7 giây
  eye_interval_gpu: 0.3        # Đo nhắm mắt khoảng 3 lần mỗi giây
  frame_budget_ms: 250         # Một khung xử lý quá 250 ms thì tự giãn thêm các mô hình phụ (tối đa x4). 0 = tắt

rules:
  # Tỉ lệ (khoảng cách đầu cao hơn vai) / (độ rộng vai).
  # Ngồi thẳng ~0.5-1.0; cúi đầu đọc/viết bài vẫn dương; chỉ khi NẰM GỤC xuống bàn (đầu ngang hoặc thấp hơn vai) mới <= 0.
  # Gục đầu bằng khung xương: báo khi đầu thấp hơn mức dưới đây VÀ không thấy mặt (úp mặt xuống bàn), bổ sung cho mô hình tự huấn luyện
  # (mô hình hay sót bạn nằm gục ở xa). Bạn cúi viết bài vẫn thấy mặt nên không bị báo. Tắt trong Cài đặt nếu thấy báo nhầm.
  head_down_pose: true
  head_down_face_max: 1        # Số điểm mặt (mũi, mắt, tai) thấy rõ tối đa để vẫn coi là úp mặt
  # Mô hình tự huấn luyện hay nhầm "ngồi cúi nhẹ, hai tay đặt trên bàn" thành ngủ. Kiểm tra chéo: nếu khung xương thấy mặt rõ
  # và đầu cao hơn vai từ ngưỡng này trở lên thì bỏ báo ngủ/gục đầu của mô hình (người nằm gục úp mặt thì không thấy mặt).
  sleep_face_veto: true
  sleep_veto_ratio: 0.15
  head_down_ratio: 0.05        # Dưới mức này mới coi là nằm gục. Tăng lên (vd 0.15) nếu muốn nhạy hơn
  # Điện thoại được tính là "đang cầm" nếu cách cổ tay/bàn < hệ số * độ rộng vai
  phone_wrist_factor: 1.10
  # Mắt được coi là nhắm nếu điểm nhắm mắt > ngưỡng
  blink_threshold: 0.50
  # Với eye_method: classifier - mắt nhắm nếu xác suất "closed" > ngưỡng này
  eye_closed_prob: 0.75
  # Chỉ phân loại mắt khi khoảng cách 2 mắt trong ảnh >= số pixel này
  min_eye_distance_px: 16

timing:                        # Hành vi phải kéo dài bao lâu (giây) mới cảnh báo
  phone: 2.0                   # 2 giây cầm điện thoại -> cảnh báo
  head_down: 3.0               # Nằm gục xuống bàn liên tục 3 giây -> cảnh báo
  sleeping: 10.0               # Nằm gục liên tục >= 10s -> cảnh báo ngủ gật
  eyes_closed: 10.0            # Nhắm mắt liên tục >= 10s -> cảnh báo ngủ gật (nhìn xuống đọc bài dễ bị đo nhầm là nhắm mắt nên để lâu)
  grace: 1.5                   # Cho phép "mất dấu" 1.5 giây mà không reset bộ đếm
  smoking: 2.0                 # Thấy điếu thuốc ở miệng/tay liên tục 2 giây -> cảnh báo
  fighting: 0.5                # Đánh nhau kéo dài 0.5 giây (cú đánh đã được đếm trong cửa sổ vài giây) -> cảnh báo
  cooldown: 10.0               # Thời gian chờ giữa 2 lần cảnh báo cùng hành vi

# Chế độ chạy: khi mở app chọn 1 chế độ, chỉ các hành vi và mô hình của chế độ đó được chạy (nhẹ hơn nhiều).
modes:
  lop:
    ten: Lớp học
    mo_ta: Điện thoại, gục đầu xuống bàn, ngủ gục, nhắm mắt
    behaviors: [phone, head_down, sleeping, eyes_closed]
    custom_behavior: weights/behavior_lop.pt
  hanhlang:
    ten: Hành lang
    mo_ta: Đánh nhau, hút thuốc
    behaviors: [fighting, smoking]
    custom_behavior: weights/behavior.pt      # bản cũ bắt hút thuốc tốt hơn bản mới

# Phát hiện đánh nhau từ khung xương (core/fight.py).
fight:
  swing_speed: 5.0             # Cổ tay nhanh hơn mức này (độ rộng vai / giây) mới tính là một cú vung
  window: 2.5                  # Đếm các cú đánh trong khoảng thời gian này (giây)
  min_strikes: 3               # Số cú vung trúng người bên cạnh để coi là đánh nhau
  min_flails: 3                # Hai người sát nhau, mỗi người vung tay từng này lần cũng bị tính

# Ánh xạ tên lớp của mô hình tự huấn luyện -> hành vi của hệ thống.
# Sửa theo đúng tên lớp trong file data.yaml của bộ dữ liệu bạn dùng.
custom_class_map:
  phone: phone
  sleep: sleeping
  sleeping: sleeping
  using_phone: phone
  bow_head: head_down
  "bowing the head": head_down
  "leaning over the table": head_down
  smoking: smoking

output:
  log_dir: logs                # Lưu file CSV và ảnh chụp khi có cảnh báo
  save_snapshots: true
  sound: true
  font: ""                     # Đường dẫn font .ttf hỗ trợ tiếng Việt ("" = tự tìm)
