# Tự build bộ cài trên máy của GitHub (miễn phí cho repo công khai):
#   - Windows: dist/LopHocAI-Setup-<phiên bản>.exe
#   - Ubuntu:  dist/lophocai_<phiên bản>_amd64.deb
# Chạy tay: tab Actions -> "Build bộ cài" -> Run workflow.
# Tạo bản phát hành: git tag v1.0.0 && git push origin v1.0.0  (bộ cài được gắn vào mục Releases)
name: Build bộ cài

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Máy Windows của GitHub mặc định in ra màn hình bằng bảng mã cp1252 (không có chữ tiếng Việt)
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Phiên bản
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || V="0.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Cài thư viện (PyTorch bản CPU cho nhẹ)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics opencv-python pillow pyyaml lap mediapipe fastapi "uvicorn[standard]" \
                      python-multipart qrcode cryptography soundfile requests pyinstaller

      - name: Build Ubuntu (.deb)
        if: runner.os == 'Linux'
        run: PY=python ./packaging/build_linux.sh

      - name: Build Windows (.exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python packaging/make_icon.py
          python -m PyInstaller packaging/lophocai.spec --noconfirm --clean --distpath dist --workpath build
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$VERSION" packaging/windows/lophocai.iss

      - uses: actions/upload-artifact@v4
        with:
          name: LopHocAI-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

      - name: Gắn vào bản phát hành
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
